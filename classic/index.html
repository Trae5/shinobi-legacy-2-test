<html lang="en">
<head>

<body><div id="slCross"></div>
<canvas id="game" aria-label="Shinobi Legacy game view"></canvas>
<main id="ui">
  <div id="loading" class="screen show"><div class="logo"><span class="l1">SHINOBI LEGACY</span><span class="l2">REMASTERED</span></div><p class="tag">Loading the ninja world…</p><noscript><p>Shinobi Legacy: Remastered needs JavaScript and WebGL to run.</p></noscript></div>
</main>
<div id="maint" style="position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3a0a0a,#07070c 70%);color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px">
<div style="font-size:clamp(28px,6vw,54px);font-weight:900;letter-spacing:.12em">SHINOBI <span style="color:#e33">LEGACY</span></div>
<div id="mmsg" style="margin-top:14px;font-size:clamp(14px,2.6vw,20px);opacity:.85">The game is down for an update.</div>
<div id="mtime" style="margin-top:10px;font-size:clamp(48px,12vw,110px);font-weight:900;font-variant-numeric:tabular-nums;color:#ffcf4a;text-shadow:0 0 24px rgba(255,80,40,.6)"></div>
<div id="msub" style="margin-top:12px;font-size:13px;opacity:.6">This page loads the game by itself as soon as it is back.</div><div id="mown" style="position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center"><button id="mownBtn" style="width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font-size:17px;opacity:.6">🛡</button><span id="mownBox" style="display:none;gap:6px;align-items:center"><input id="mownCode" type="password" placeholder="Owner code" autocomplete="off" style="padding:8px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;font-size:16px;width:130px"><button id="mownPlay" style="padding:8px 12px;border-radius:8px;border:0;background:#c8323c;color:#fff;font-weight:700">Play (owner only)</button><button id="mownGo" style="padding:8px 12px;border-radius:8px;border:0;background:#2a9d4a;color:#fff;font-weight:700">Reopen for everyone</button><span id="mownMsg" style="font-size:12px;color:#ff8a8a"></span></span></div></div>
<div id="mlock" style="position:fixed;inset:0;z-index:99998;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#2a0b10,#0b0b0e 68%);color:#f2eee8;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px">
<div style="width:74px;height:74px;border-radius:50%;border:2px solid #c8243a;display:flex;align-items:center;justify-content:center;font-size:38px;color:#ff4a5e;box-shadow:0 0 28px rgba(200,36,58,.35)">✕</div>
<div style="margin-top:18px;font-size:12px;letter-spacing:.32em;color:#d8b46a">SHINOBI LEGACY</div>
<div id="mlMsg" style="margin-top:12px;font-size:clamp(17px,4.6vw,24px);font-weight:700;max-width:520px;line-height:1.35">Mobile is currently unavailable at the moment — doing testing.</div>
<div style="margin-top:10px;font-size:14px;opacity:.65">Play on PC for now.</div>
<div style="position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button id="mlBtn" style="width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);color:#fff;font-size:18px;opacity:.6">🛡</button><span id="mlBox" style="display:none;gap:6px;align-items:center"><input id="mlCode" type="password" placeholder="Owner code" autocomplete="off" style="padding:9px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;font-size:16px;width:130px"><button id="mlPlay" style="padding:9px 12px;border-radius:8px;border:0;background:#b0182c;color:#fff;font-weight:700">Play (owner only)</button><span id="mlMsg2" style="font-size:12px;color:#ff8a8a"></span></span></div></div>
<script>window.__SL_GATE={on:(function(){try{return !/-test/.test(location.pathname)}catch(e){return true}})(),message:"The game is down for testing. A massive update is building. Back soon."};</script>
<script>(function(){var el=document.getElementById('maint'),t=document.getElementById('mtime'),mm=document.getElementById('mmsg'),started=false,off=0,st=null;
function wipe(ep){try{var ls=localStorage;if(ls.getItem('shinobi_legacy_server_epoch')===ep)return;var had=ls.getItem('shinobi_legacy_server_epoch')!==null||ep!=='base';if(ep!=='base'){var k=[];for(var i=0;i<ls.length;i++){var x=ls.key(i);if(/^shinobi_legacy_save_v1/.test(x)||x==='shinobi_legacy_pending_create'||x==='shinobi_legacy_slot'||x==='shinobi_legacy_force_roll')k.push(x);}k.forEach(function(x){ls.removeItem(x)});}ls.setItem('shinobi_legacy_server_epoch',ep);}catch(e){}}
function isMob(){try{var ua=navigator.userAgent||'';if(/iPhone|iPad|iPod|Android|Mobile/i.test(ua))return true;if(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)return true;return !!(window.matchMedia&&matchMedia('(pointer:coarse)').matches&&navigator.maxTouchPoints>0);}catch(e){return false;}}window.__slIsMob=isMob;
function mlock(){var m=document.getElementById('mlock');m.style.display='flex';el.style.display='none';}
function go(){if(started)return;document.getElementById('mlock').style.display='none';started=true;el.style.display='none';var s=document.createElement('script');s.type='module';s.src='game.js?v='+((window.__slServer&&window.__slServer.build)||'1148');document.body.appendChild(s);}
function fmt(ms){var s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;}
function tick(){if(!st||started)return;if(st.until){var r=st.until-(Date.now()+off);if(r<=0){check();return;}t.textContent=fmt(r);}else t.textContent='';setTimeout(tick,250);}
function show(s){st=s;el.style.display='flex';mm.textContent=s.message||(s.until?'The game is down for an update. Back in':'The game is down for maintenance. Check back soon.');tick();}
function ptWipe(b,host){/* C11 (Trae, Nov 11 8:00 AM): TEST SERVER ONLY. A new build on shinobi-pubtest deletes every test save slot. Never runs on any other host. */try{if(!/shinobi-pubtest|shinobi-testserver/.test(host||location.hostname)||!b)return 0;var ls=localStorage,prev=ls.getItem('sl_pt_build');if(prev===b)return 0;var k=[];for(var i=0;i<ls.length;i++){var x=ls.key(i);if(/^shinobi_legacy_save_v1/.test(x)||x==='shinobi_legacy_pending_create'||x==='shinobi_legacy_slot'||x==='shinobi_legacy_force_roll')k.push(x);}k.forEach(function(x){ls.removeItem(x)});ls.setItem('sl_pt_build',b);if(prev){var d=document.createElement('div');d.id='ptWiped';d.textContent='Test server updated, test saves were reset.';d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;background:rgba(10,10,20,.92);color:#ffdf94;border:1px solid rgba(233,192,106,.6);border-radius:10px;padding:8px 14px;font:600 13px system-ui,sans-serif;pointer-events:none';(document.body||document.documentElement).appendChild(d);setTimeout(function(){d.remove()},6000);}return k.length||-1;}catch(e){return 0;}}
function check(){if(window.__SL_GATE&&window.__SL_GATE.on){show({message:window.__SL_GATE.message||"The game is down for testing. Back soon."});setTimeout(function(){if(!started)check()},15000);return;}var c=new AbortController();var to=setTimeout(function(){c.abort()},4000);fetch('/api/status?x='+Date.now(),{cache:'no-store',signal:c.signal}).then(function(r){return r.json()}).then(function(s){clearTimeout(to);off=(s.now||Date.now())-Date.now();wipe(s.epoch||'base');ptWipe(s.build);window.__slServer=s;var mob=isMob();if(s.mobileLock!==false&&mob){var oc0='';try{oc0=sessionStorage.getItem('shinobi_owner_code_session')||localStorage.getItem('shinobi_owner_login')||'';}catch(e){}if(oc0){ownerPass(oc0,function(ok){if(ok)go();else mlock();});return;}mlock();return;}if(s.shutdown){var oc='';try{oc=sessionStorage.getItem('shinobi_owner_code_session')||localStorage.getItem('shinobi_owner_login')||'';}catch(e){}if(oc){ownerPass(oc,function(ok){if(ok)go();else{show(s);setTimeout(function(){if(!started)check()},15000);}});return;}show(s);setTimeout(function(){if(!started)check()},15000);}else go();}).catch(function(){clearTimeout(to);go();});}
function ownerPass(code,cb){fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code,action:'check'})}).then(function(r){return r.json()}).then(function(j){if(j.ok){try{sessionStorage.setItem('shinobi_owner_code_session',code);window.__slOwnerPass=1;}catch(e){}cb(true);}else cb(false);}).catch(function(){cb(false)});}
document.getElementById('mownBtn').onclick=function(){var b=document.getElementById('mownBox');b.style.display=b.style.display==='none'?'flex':'none';document.getElementById('mownCode').focus();};
document.getElementById('mownGo').onclick=function(){var m=document.getElementById('mownMsg');m.style.color='#ccc';m.textContent='...';fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.getElementById('mownCode').value,action:'open'})}).then(function(r){return r.json()}).then(function(j){if(j.ok){m.style.color='#7dffa0';m.textContent='Reopened';check();}else{m.style.color='#ff8a8a';m.textContent=j.error==='locked'?'Too many tries, wait '+j.wait+'s':j.error==='wrong code'?'Wrong code':'Error';}}).catch(function(){m.textContent='No connection';});};
document.getElementById('mownPlay').onclick=function(){var m=document.getElementById('mownMsg');m.style.color='#ccc';m.textContent='...';ownerPass(document.getElementById('mownCode').value.trim(),function(ok){if(ok){m.textContent='';go();}else{m.style.color='#ff8a8a';m.textContent='Wrong code';}});};
document.getElementById('mlBtn').onclick=function(){var b=document.getElementById('mlBox');b.style.display=b.style.display==='none'?'flex':'none';document.getElementById('mlCode').focus();};
document.getElementById('mlPlay').onclick=function(){var m=document.getElementById('mlMsg2');m.style.color='#ccc';m.textContent='...';ownerPass(document.getElementById('mlCode').value.trim(),function(ok){if(ok){m.textContent='';if(window.__slServer&&window.__slServer.shutdown){go();}else go();}else{m.style.color='#ff8a8a';m.textContent='Wrong code';}});};
check();})();</script>
</body>
